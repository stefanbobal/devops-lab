services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector-banka
    environment:
      POSTGRES_PASSWORD: lab   # local lab only, never use real credentials here
    ports:
      - "5433:5432"
    volumes:
      - pgdata_banka:/var/lib/postgresql/data

volumes:
  pgdata_banka:
